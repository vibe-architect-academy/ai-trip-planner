<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Trip Planner</title>
<meta name="description" content="Describe the trip. Get a real plan, day by day.">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'media' };
</script>
<style type="text/tailwindcss">
  @layer utilities {
    .focus-ring {
      @apply focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600 focus-visible:ring-offset-2 dark:focus-visible:ring-indigo-400 dark:focus-visible:ring-offset-slate-900;
    }
  }
</style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 to-indigo-50 dark:from-slate-950 dark:to-slate-900 text-slate-900 dark:text-slate-100 antialiased">

<main class="mx-auto w-full max-w-xl px-5 py-10 sm:py-16">

  <header class="mb-8">
    <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">
      AI Trip Planner <span class="text-indigo-600 dark:text-indigo-400" aria-hidden="true">&#10022;</span>
    </h1>
    <p class="mt-2 text-slate-600 dark:text-slate-400">
      Describe the trip. Get a real plan, day by day.
    </p>
  </header>

  <section class="rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/60 p-5 sm:p-6 shadow-sm">
    <form id="plan-form" novalidate>
      <div class="flex flex-col sm:flex-row gap-4">
        <div class="flex-1">
          <label for="dest" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
            Where to?
          </label>
          <input
            id="dest"
            name="dest"
            type="text"
            placeholder="Kyoto"
            autocomplete="off"
            class="focus-ring w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3.5 py-3 text-base text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500"
          >
        </div>
        <div class="sm:w-28">
          <label for="days" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
            Days
          </label>
          <input
            id="days"
            name="days"
            type="number"
            min="1"
            max="7"
            inputmode="numeric"
            placeholder="3"
            autocomplete="off"
            class="focus-ring w-full rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-3.5 py-3 text-base text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500"
          >
        </div>
      </div>

      <button
        id="go"
        type="submit"
        class="focus-ring mt-5 w-full rounded-lg bg-indigo-600 px-4 py-3.5 text-base font-semibold text-white hover:bg-indigo-700 active:bg-indigo-800 disabled:opacity-60 disabled:cursor-wait transition-colors"
      >
        Generate my trip
      </button>
    </form>

    <p id="status" role="status" aria-live="polite" class="mt-4 hidden items-center gap-2 text-sm text-slate-600 dark:text-slate-400">
      <span class="inline-block h-2 w-2 rounded-full bg-indigo-600 dark:bg-indigo-400 motion-safe:animate-pulse" aria-hidden="true"></span>
      Planning your days...
    </p>
  </section>

  <section
    id="itinerary"
    aria-live="polite"
    class="mt-6 hidden rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/60 p-5 sm:p-6 shadow-sm"
  >
    <div id="out" class="prose-trip text-[15px] leading-relaxed"></div>
  </section>

</main>

<style type="text/tailwindcss">
  @layer components {
    .prose-trip h2 {
      @apply mt-6 first:mt-0 mb-2 text-lg font-semibold text-indigo-700 dark:text-indigo-400;
    }
    .prose-trip ul { @apply list-disc pl-5 space-y-1.5; }
    .prose-trip li { @apply text-slate-700 dark:text-slate-300; }
    .prose-trip strong { @apply font-semibold text-slate-900 dark:text-slate-100; }
  }
</style>

<script src="config.js"></script>
<script>
  const API_KEY = (window.CONFIG || {}).GEMINI_API_KEY;

  const form = document.getElementById("plan-form");
  const btn = document.getElementById("go");
  const status = document.getElementById("status");
  const box = document.getElementById("itinerary");
  const out = document.getElementById("out");

  // `hidden` loses to `flex`, so show/hide by swapping both classes.
  function show(el, display) {
    el.classList.remove("hidden");
    el.classList.add(display);
  }
  function hide(el, display) {
    el.classList.add("hidden");
    el.classList.remove(display);
  }

  function mdToHtml(md) {
    return md
      .replace(/^### (.*)$/gm, "<h2>$1</h2>")
      .replace(/^## (.*)$/gm, "<h2>$1</h2>")
      .replace(/^\*\*(.*)\*\*$/gm, "<h2>$1</h2>")
      .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
      .replace(/^[-*] (.*)$/gm, "<li>$1</li>")
      .replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g, "<ul>$1</ul>")
      .replace(/\n{2,}/g, "<br>");
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    if (!API_KEY) {
      show(box, "block");
      out.textContent = "No API key found. Copy config.example.js to config.js and put your Gemini key in it.";
      return;
    }

    const dest = document.getElementById("dest").value.trim() || "Kyoto";
    const days = document.getElementById("days").value.trim() || "3";

    btn.disabled = true;
    show(status, "flex");
    hide(box, "block");
    out.innerHTML = "";

    const body = {
      contents: [{ parts: [{ text:
        `Plan a ${days}-day trip to ${dest}. For each day give a morning activity, an afternoon activity, an evening activity, and a restaurant recommendation, with specific real places. Format: a heading per day like "### Day 1", then 4 short bullet points. No intro or outro text, start directly with Day 1.` }] }]
    };
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:streamGenerateContent?alt=sse&key=${API_KEY}`;
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let md = "", buf = "";

    hide(status, "flex");
    show(box, "block");

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        try {
          const chunk = JSON.parse(line.slice(6));
          const t = chunk.candidates?.[0]?.content?.parts?.[0]?.text || "";
          if (t) { md += t; out.innerHTML = mdToHtml(md); }
        } catch (e) {}
      }
    }

    btn.disabled = false;
  });
</script>
</body>
</html>
