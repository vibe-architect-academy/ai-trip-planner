# One server is not enough.
#
# Vercel does this for you, invisibly, which is exactly why it is worth seeing
# written out once. This is the same job: several copies of the app, something
# in front deciding who gets each request, and a way to notice when one of
# them stops answering.

upstream trip_planner {
    # least_conn rather than round robin. Requests here are wildly uneven: a
    # seven day itinerary occupies a worker for most of a minute while a page
    # load takes milliseconds. Round robin would keep handing new work to the
    # instance already busy with the slow one.
    least_conn;

    server app1:3000 max_fails=3 fail_timeout=30s;
    server app2:3000 max_fails=3 fail_timeout=30s;
    server app3:3000 max_fails=3 fail_timeout=30s;

    # Reuse connections instead of building a new one per request.
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Nginx buffers responses by default, which would hold a streaming
    # itinerary until it finished and undo lesson 10 entirely. This is the
    # single most common way streaming quietly stops working behind a proxy.
    proxy_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Without these the app sees nginx's address as the client for every
    # request, which breaks rate limiting and makes logs useless.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Generous, because generating a long itinerary genuinely takes a while.
    # Shorter than the app's own 120s ceiling would mean the proxy gives up
    # first and the user sees a 504 for work that was going to succeed.
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;

    location / {
        proxy_pass http://trip_planner;
    }

    # Health checks go to whichever instance answers, and are not logged.
    # Otherwise a check every few seconds becomes most of the access log.
    location /api/health {
        proxy_pass http://trip_planner;
        access_log off;
    }

    # Fingerprinted assets are identical on every instance and never change,
    # so nginx can answer from its own cache without asking any of them.
    location /_next/static/ {
        proxy_pass http://trip_planner;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
